</style></head><body><div class="wrap"><a class="back" href="/">← 返回题库首页</a><div class="top"><div><div class="eyebrow">2010 · 完形 · Q2</div><h1>end + 介词/副词</h1></div><div class="progress" id="progress"></div></div><div class="panel"><div class="k-title">Knowledge</div><div class="chips" id="chips"></div><div class="knowledge-detail" id="knowledgeDetail"></div></div><div class="quiz-card"><div><div class="qmeta" id="qmeta"></div><div class="question" id="question"></div><div class="vocab-hint">点击带虚线下划线的词，可查看英文释义</div><div class="vocab-box" id="vocabBox"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div></div><div class="nav"><button class="btn secondary" id="prevBtn">← Previous</button><div class="dots" id="dots"></div><button class="btn primary" id="nextBtn">Next →</button></div></div></div><script>
const knowledge={"end up":{def:"to finally do, become, or be in a particular situation, often after an unexpected process",pattern:"end up + V-ing / adjective / in-at-with + noun",core:"process → final result"},"end in":{def:"to finish with a particular result or outcome",pattern:"end in + result/state noun",core:"event → outcome"},"end with":{def:"to have something as the final part, item, or content of an event or sequence",pattern:"end with + noun / final content",core:"sequence → final content"},"end at":{def:"to stop at a specific time, place, point, number, or level",pattern:"end at + time / place / point / number",core:"process → endpoint"},"end on":{def:"to finish on a particular note, state, topic, scene, or final item",pattern:"end on + note / question / scene / point / state",core:"sequence → final point/state"}};
const vocab={"pessimistic":"expecting bad things to happen or believing the future will be bad","hopeful":"feeling or showing hope about the future","minor":"not very important, serious, or large","technical":"connected with a particular practical subject, method, or skill","conference":"a formal meeting for discussion","protest":"an organized public expression of disagreement","peaceful":"not involving violence or conflict","violence":"behavior involving physical force intended to hurt or damage","report":"a written or spoken account that gives information","warning":"a statement that tells someone about possible danger or problems","negotiations":"formal discussions intended to reach an agreement","deal":"an agreement, especially in business","unanswered":"not answered or resolved","audience":"the people watching or listening to a performance or speech","dispute":"a serious disagreement","breakdown":"a failure or collapse of a relationship, system, or process","chairman":"the person who leads a meeting or organization","expression":"something said or done to communicate a feeling or idea","volunteers":"people who offer to do something without being paid","trail":"a path through the countryside","edge":"the outer boundary of something"};
const base=[{q:"Although most of the article is pessimistic, it ___ a surprisingly hopeful note.",a:"end on",t:["pessimistic","hopeful"]},{q:"What began as a minor technical problem ___ costing the company millions of dollars.",a:"end up",t:["minor","technical"]},{q:"The conference begins at 9 a.m. and will ___ 4:30 p.m.",a:"end at",t:["conference"]},{q:"The protest remained peaceful for most of the day but later ___ violence.",a:"end in",t:["protest","peaceful","violence"]},{q:"The report ___ a short warning about the risks of relying too heavily on a single source of data.",a:"end with",t:["report","warning"]},{q:"After several failed negotiations, the two companies finally ___ signing a much smaller deal than either side had originally planned.",a:"end up",t:["negotiations","deal"]},{q:"The film ___ an unanswered question, leaving the audience to decide what happened next.",a:"end on",t:["unanswered","audience"]},{q:"The months-long dispute eventually ___ a complete breakdown in relations between the two organizations.",a:"end in",t:["dispute","breakdown"]},{q:"The chairman ___ a brief expression of thanks to the staff and volunteers.",a:"end with",t:["chairman","expression","volunteers"]},{q:"The hiking trail ___ the edge of the lake, where visitors can turn back or continue by boat.",a:"end at",t:["trail","edge"]}];const questions=[...base].sort(()=>Math.random()-.5),opts=["end up","end in","end with","end at","end on"];let current=0;const answered=Array(questions.length).fill(null);Object.keys(knowledge).forEach(k=>{const b=document.createElement("button");b.className="chip";b.textContent=k;b.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");const x=knowledge[k];knowledgeDetail.style.display="block";knowledgeDetail.innerHTML="<b>"+k+"</b><br>"+x.def+"<br><br><b>Pattern:</b> "+x.pattern+"<br><b>Core:</b> "+x.core};chips.appendChild(b)});function cq(text,terms){let h=text;[...terms].sort((a,b)=>b.length-a.length).forEach(t=>h=h.replace(new RegExp("\\b"+t+"\\b","gi"),m=>'<span class="vocab-word" data-word="'+t+'">'+m+'</span>'));return h}function bind(){document.querySelectorAll(".vocab-word").forEach(el=>el.onclick=()=>{const w=el.dataset.word;vocabBox.classList.add("show");vocabBox.innerHTML="<b>"+w+"</b><br>"+vocab[w]})}function ds(){dots.innerHTML="";questions.forEach((_,i)=>{const d=document.createElement("span");d.className="dot"+(i===current?" active":"");dots.appendChild(d)})}function render(){const x=questions[current];progress.textContent=(current+1)+" / "+questions.length;qmeta.textContent="Question "+(current+1);question.innerHTML=cq(x.q,x.t);vocabBox.className="vocab-box";vocabBox.innerHTML="";options.innerHTML="";opts.forEach(c=>{const b=document.createElement("button");b.className="opt";b.textContent=c;if(answered[current]){if(c===x.a)b.classList.add("correct");if(c===answered[current]&&c!==x.a)b.classList.add("wrong")}b.onclick=()=>{answered[current]=c;render()};options.appendChild(b)});feedback.className="feedback";if(answered[current]){const k=knowledge[x.a],ok=answered[current]===x.a;feedback.classList.add("show");feedback.innerHTML="<b>"+(ok?"✅ Correct":"❌ Best answer: "+x.a)+"</b><br>"+k.def+"<br><b>Core:</b> "+k.core+"<br><b>Pattern:</b> "+k.pattern}prevBtn.disabled=current===0;nextBtn.textContent=current===questions.length-1?"Finish":"Next →";ds();bind()}prevBtn.onclick=()=>{if(current>0){current--;render()}};nextBtn.onclick=()=>{if(current<questions.length-1){current++;render()}};render();
</script></body></html>
