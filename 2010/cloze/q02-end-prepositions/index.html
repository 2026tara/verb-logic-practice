<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2010 完形 Q2 · end + particle 卡片版</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --text:#17191f; --muted:#6b7280;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:900px;margin:32px auto;padding:0 18px 40px}
.back{display:inline-block;margin-bottom:14px;color:#5d62d6;text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}
.eyebrow{font-size:13px;color:var(--muted);margin-bottom:6px}
h1{font-size:28px;margin:0}
.progress{font-size:14px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}
.k-title{font-size:15px;font-weight:700;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;cursor:pointer;font-size:14px}
.chip.active{background:#17191f;color:#fff;border-color:#17191f}
.knowledge-detail{display:none;margin-top:14px;padding:14px;border-radius:14px;background:#f7f8fa;line-height:1.6;font-size:14px}
.quiz-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;min-height:440px;display:flex;flex-direction:column;justify-content:space-between}
.qmeta{font-size:13px;color:var(--muted);margin-bottom:12px}
.question{font-size:22px;line-height:1.65;margin-bottom:22px}
.options{display:grid;gap:10px}
.opt{border:1px solid #d9dde4;background:#fff;border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;font-size:16px}
.opt:hover{border-color:#8f93a1}
.opt.correct{border-color:#4aa66b;background:#eef9f1}
.opt.wrong{border-color:#d66b6b;background:#fff2f2}
.feedback{display:none;margin-top:18px;border-radius:14px;padding:14px 16px;background:#f3f5f8;line-height:1.6}
.feedback.show{display:block}
.answerline{font-weight:700;margin-bottom:4px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px}
.btn{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;font-size:14px}
.secondary{background:#eceef2;color:#222}
.primary{background:#17191f;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#d7dbe2}
.dot.active{background:#17191f}
@media(max-width:640px){
  .question{font-size:19px}
  .quiz-card{padding:20px;min-height:420px}
  .top{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 返回题库首页</a>
  <div class="top">
    <div>
      <div class="eyebrow">2010 · 完形 · Q2</div>
      <h1>end + 介词/副词</h1>
    </div>
    <div class="progress" id="progress">1 / 10</div>
  </div>

  <div class="panel">
    <div class="k-title">Knowledge</div>
    <div class="chips" id="chips"></div>
    <div class="knowledge-detail" id="knowledgeDetail"></div>
  </div>

  <div class="quiz-card">
    <div>
      <div class="qmeta" id="qmeta">Question 1</div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="nav">
      <button class="btn secondary" id="prevBtn">← Previous</button>
      <div class="dots" id="dots"></div>
      <button class="btn primary" id="nextBtn">Next →</button>
    </div>
  </div>
</div>

<script>
const knowledge = {
  "end up": {
    def: "to finally do, become, or be in a particular situation, often after an unexpected process",
    pattern: "end up + V-ing / adjective / in-at-with + noun",
    core: "process → final result"
  },
  "end in": {
    def: "to finish with a particular result or outcome",
    pattern: "end in + result/state noun",
    core: "event → outcome"
  },
  "end with": {
    def: "to have something as the final part, item, or content of an event or sequence",
    pattern: "end with + noun / final content",
    core: "sequence → final content"
  },
  "end at": {
    def: "to stop at a specific time, place, point, number, or level",
    pattern: "end at + time / place / point / number",
    core: "process → endpoint"
  },
  "end on": {
    def: "to finish on a particular note, state, topic, scene, or final item",
    pattern: "end on + note / question / scene / point / state",
    core: "sequence → final point/state"
  }
};

const baseQuestions = [
  ["Although most of the article is pessimistic, it ___ a surprisingly hopeful note.","end on"],
  ["What began as a minor technical problem ___ costing the company millions of dollars.","end up"],
  ["The conference begins at 9 a.m. and will ___ 4:30 p.m.","end at"],
  ["The protest remained peaceful for most of the day but later ___ violence.","end in"],
  ["The report ___ a short warning about the risks of relying too heavily on a single source of data.","end with"],
  ["After several failed negotiations, the two companies finally ___ signing a much smaller deal than either side had originally planned.","end up"],
  ["The film ___ an unanswered question, leaving the audience to decide what happened next.","end on"],
  ["The months-long dispute eventually ___ a complete breakdown in relations between the two organizations.","end in"],
  ["The chairman ___ a brief expression of thanks to the staff and volunteers.","end with"],
  ["The hiking trail ___ the edge of the lake, where visitors can turn back or continue by boat.","end at"]
];

const questions = [...baseQuestions].sort(() => Math.random() - 0.5);
const options = ["end up","end in","end with","end at","end on"];
let current = 0;
const answered = Array(questions.length).fill(null);

const chips = document.getElementById("chips");
const detail = document.getElementById("knowledgeDetail");
Object.keys(knowledge).forEach(k=>{
  const b=document.createElement("button");
  b.className="chip";
  b.textContent=k;
  b.onclick=()=>{
    document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    const x=knowledge[k];
    detail.style.display="block";
    detail.innerHTML=`<b>${k}</b><br>${x.def}<br><br><b>Pattern:</b> ${x.pattern}<br><b>Core:</b> ${x.core}`;
  };
  chips.appendChild(b);
});

function renderDots(){
  const d=document.getElementById("dots");
  d.innerHTML="";
  questions.forEach((_,i)=>{
    const x=document.createElement("span");
    x.className="dot"+(i===current?" active":"");
    d.appendChild(x);
  });
}
function render(){
  const [q,ans]=questions[current];
  document.getElementById("progress").textContent=`${current+1} / ${questions.length}`;
  document.getElementById("qmeta").textContent=`Question ${current+1}`;
  document.getElementById("question").textContent=q;
  const op=document.getElementById("options");
  const fb=document.getElementById("feedback");
  op.innerHTML="";
  fb.className="feedback";
  fb.innerHTML="";
  options.forEach(choice=>{
    const b=document.createElement("button");
    b.className="opt";
    b.textContent=choice;
    if(answered[current]){
      if(choice===ans) b.classList.add("correct");
      if(choice===answered[current] && choice!==ans) b.classList.add("wrong");
    }
    b.onclick=()=>{
      answered[current]=choice;
      render();
    };
    op.appendChild(b);
  });
  if(answered[current]){
    const ok=answered[current]===ans;
    const k=knowledge[ans];
    fb.classList.add("show");
    fb.innerHTML=`<div class="answerline">${ok?"✅ Correct":"❌ Best answer: "+ans}</div>${k.def}<br><b>Core:</b> ${k.core}<br><b>Pattern:</b> ${k.pattern}`;
  }
  document.getElementById("prevBtn").disabled=current===0;
  document.getElementById("nextBtn").textContent=current===questions.length-1?"Finish":"Next →";
  renderDots();
}
document.getElementById("prevBtn").onclick=()=>{ if(current>0){current--;render();}};
document.getElementById("nextBtn").onclick=()=>{ if(current<questions.length-1){current++;render();}};
render();
</script>
</body>
</html>
